# ============================================================================
# Tana Voice Note Agent v3 — configuration
# ============================================================================
# This is the ONE file to adapt the agent to your setup. The sync script and
# all three skills (vn-sync, vn-process, vn-catalog) read it.
# Fill workspace_id and choose what to sync by running:
#     python3 scripts/sync_voice_notes.py --setup
# ============================================================================

tana:
  # Name of the Tana MCP server entry in your harness config (~/.claude.json).
  # The sync script reads the URL and Authorization token from there — the
  # token is never stored in this repo. Env overrides: TANA_MCP_URL, TANA_MCP_TOKEN.
  mcp_server_name: "tana-local"
  url: "http://127.0.0.1:8262/mcp"

  # Filled by --setup:
  workspace_id: ""
  workspace_name: ""

  # WHICH nodes count as a voice note. Default: every voice memo in the
  # workspace — any node with an audio recording attached (Tana's `has: audio`),
  # tagged or not. You do NOT need a supertag to use this tool.
  #   all_audio  every node with audio attached                    (default)
  #   tagged     only nodes carrying voice_note_tag_id below
  #   both       audio memos OR tagged nodes (union)
  # Override for a single run: --source tagged / --source both / --tag <id>.
  source: "all_audio"

  # Only read when source is "tagged" or "both". Leave empty otherwise;
  # --setup fills it if you choose a tag-based mode.
  voice_note_tag_id: ""      # e.g. the id of your #voice note supertag

  # Other supertags that ALSO mark voice notes — a legacy "#voice memo", a
  # "#conversation voice note"... Read by tagged / both and by --history.
  # Inline list only (the no-PyYAML fallback parser doesn't read block lists):
  #   extra_tag_ids: ["abc123", "def456"]
  extra_tag_ids: []

  # The field labels the parser looks for in a note's children, exactly as they
  # appear in your Tana template. Change these if you renamed the fields or use
  # a non-English template.
  field_labels:
    transcript: "Transcript"
    summary: "Transcript Summary (AI)"

  # Super Folders: Tana field label -> frontmatter key. When a synced node
  # carries one of these fields, its values arrive pre-filled in the note's
  # frontmatter (kebab-case) and the Tana node ids are kept in `tana_refs`.
  # Labels match loosely: "Area", "Areas" and "Area(s)" are all the same.
  # Add any other superfolder you use, e.g.   people: "Person(s)"
  category_fields:
    areas: "Area(s)"
    projects: "Project(s)"
    topics: "Topic(s)"

  # The supertags whose instances ARE your vocabulary (your #area / #project /
  # #topic tags, or the template's merge tags). Filled by /vn-catalog vocab.
  category_tag_ids: {}       # e.g. {areas: "<tag id>", projects: "...", topics: "..."}

  # Should /vn-catalog mirror confirmed areas/projects/topics back to the
  # note's Tana Super Folder fields? false = Tana is capture-only (default).
  # Set during /vn-sync setup; flip it any time.
  sync_connections: false

  # Cache of Tana field IDs, resolved once by /vn-catalog sync via
  # get_tag_schema. Leave empty; the agent fills it.
  field_ids: {}

  # Full-history import (python3 scripts/sync_voice_notes.py --history).
  # Tana returns at most 1000 search results per call, so the sweep walks the
  # workspace backwards in date windows; a window that fills up is halved.
  history:
    window_days: 90          # initial window
    batch: 0                 # 0 = fetch everything; N = stop after N notes (re-run to continue)

archive:
  # Where synced notes live. A path relative to this repo, or an ABSOLUTE path
  # into your own Second Brain / OS folder (recommended if you have one), e.g.
  # dir: "/Users/you/SecondBrain/Voice-Notes"
  dir: "Voice-Notes"

  # by-year:  Voice-Notes/2026/2026-08-31-title.md   (default, proven at 650+ notes)
  # by-month: Voice-Notes/2026/08/2026-08-31-title.md
  # flat:     Voice-Notes/2026-08-31-title.md
  layout: "by-year"

  # Filename pattern. Available variables: {date} {slug}
  filename: "{date}-{slug}.md"

  # Language for command outputs (summaries, reports...). Notes themselves stay
  # in whatever language you spoke them.
  language: "en"

  # After each sync, enrich newly arrived notes: clean a raw transcript
  # (filler removal, punctuation, paragraphs — meaning preserved) and generate
  # a summary when Tana didn't provide one. Agent-side; see the vn-sync skill.
  enrich: true

catalog:
  # Your organizational vocabulary. vn-catalog proposes assignments from these
  # lists (and from existing Collections) before inventing anything new.
  areas: []          # e.g. [health, career, relationships, creativity]
  projects: []       # e.g. [product-launch, book-draft]
  topics: []         # e.g. [ai, philosophy, marketing]

  # Tana node ids behind the vocabulary values, so /vn-catalog sync writes
  # references ([[Name^id]]) instead of plain text. Maintained by
  # /vn-catalog vocab — you don't need to fill this by hand.
  tana_ids: {}       # e.g. {areas: {home-family: "hg6UQLfpqB4G"}}

  # Keyword -> tag map used by the sync script to seed frontmatter tags from
  # note titles. Left empty by default; add your own recurring vocabulary.
  # Example:
  #   tag_keywords:
  #     "gene keys": "gene-keys"
  #     "instagram": "instagram"
  tag_keywords: {}
